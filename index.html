<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mes Mails</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --bg: #0a0a0a; --panel: #141414; --panel-2: #1c1c1c; --border: #262626; --ink: #f5f5f5; --ink-dim: #8a8a8a; --accent: #4a9eff; --success: #2d8a4e; --error: #c0392b; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.5; }
  
  #login-screen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
  #login-screen.hidden { display: none; }
  .login-logo { width: 96px; height: 96px; margin-bottom: 1.5rem; border-radius: 24px; background: linear-gradient(135deg, #1a1a2e, #0a0a0a); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
  .login-logo svg { width: 60%; height: 60%; }
  .login-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.3rem; }
  .login-sub { font-size: 0.85rem; color: var(--ink-dim); margin-bottom: 2rem; text-align: center; }
  .login-form { width: 100%; max-width: 340px; }
  .login-input { width: 100%; padding: 0.95rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--ink); font-size: 0.95rem; font-family: inherit; margin-bottom: 0.8rem; text-align: center; letter-spacing: 0.1em; }
  .login-input:focus { outline: none; border-color: var(--accent); }
  .login-btn { width: 100%; padding: 0.95rem; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .login-error { color: var(--error); font-size: 0.82rem; text-align: center; margin-top: 0.8rem; min-height: 1.2em; }

  #app { display: none; } #app.visible { display: block; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.9rem 1rem; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  header .actions { display: flex; gap: 0.4rem; }
  header button { background: var(--accent); color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  header button.logout { background: var(--panel-2); color: var(--ink-dim); padding: 0.5rem 0.7rem; }
  .tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 57px; z-index: 9; }
  .tab { flex: 1; text-align: center; padding: 0.75rem; font-size: 0.8rem; color: var(--ink-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  .list { padding: 0.5rem; }
  .mail-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 0.9rem; margin-bottom: 0.5rem; cursor: pointer; border-left-width: 3px; border-left-color: var(--accent); }
  .mail-header { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
  .mail-from { font-size: 0.85rem; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-subject { font-size: 0.82rem; margin: 0.15rem 0; }
  .mail-preview { font-size: 0.75rem; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-date { font-size: 0.68rem; color: var(--ink-dim); margin-top: 0.3rem; }
  .empty { text-align: center; color: var(--ink-dim); padding: 3rem 1rem; font-size: 0.85rem; }
  .loading { text-align: center; padding: 2rem; color: var(--ink-dim); font-size: 0.85rem; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.8rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .view { display: none; } .view.active { display: block; }
  .detail { padding: 1rem; }
  .detail-header { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .detail-subject { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
  .detail-meta { font-size: 0.78rem; color: var(--ink-dim); }
  .detail-body { font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; padding: 1rem; background: var(--panel); border-radius: 10px; border: 1px solid var(--border); min-height: 100px; }
  .detail-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .btn { flex: 1; padding: 0.85rem; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-back { background: transparent; color: var(--accent); border: none; padding: 0.5rem 0; font-size: 0.9rem; cursor: pointer; margin-bottom: 0.5rem; }

  .compose { padding: 1rem; }
  .field { margin-bottom: 0.8rem; }
  .field label { display: block; font-size: 0.72rem; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 0.3rem; font-weight: 600; }
  .field input, .field textarea { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--ink); font-family: inherit; font-size: 0.9rem; }
  .field textarea { min-height: 180px; resize: vertical; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--bg); padding: 0.8rem 1.2rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; transition: transform 0.3s, opacity 0.3s; opacity: 0; z-index: 100; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: var(--error); color: #fff; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4a9eff"/><stop offset="100%" stop-color="#7b5cff"/></linearGradient></defs><g transform="translate(96, 146)"><rect x="0" y="0" width="320" height="220" rx="20" fill="none" stroke="url(#lg1)" stroke-width="14"/><path d="M 20 20 L 160 130 L 300 20" fill="none" stroke="url(#lg1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
  </div>
  <div class="login-title">Mes Mails</div>
  <div class="login-sub">Toutes vos boîtes, en un seul endroit</div>
  <div class="login-form">
    <input type="password" class="login-input" id="login-password" placeholder="••••••••">
    <button class="login-btn" id="login-btn">Se connecter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1 id="app-title">Mes Mails</h1>
    <div class="actions"><button id="refresh-btn">↻</button><button class="logout" id="logout-btn">⏻</button></div>
  </header>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="inbox">Réception</div>
    <div class="tab" data-tab="compose">Écrire</div>
  </div>

  <div class="view active" id="view-inbox"><div class="list" id="mail-list"></div></div>

  <div class="view" id="view-detail">
    <div class="detail">
      <button class="btn-back" id="back-btn">← Retour</button>
      <div class="detail-header">
        <div class="detail-subject" id="d-subject"></div>
        <div class="detail-meta" id="d-from"></div>
        <div class="detail-meta" id="d-date"></div>
      </div>
      <div class="detail-body" id="d-body"></div>
    </div>
  </div>

  <div class="view" id="view-compose">
    <div class="compose">
      <div class="field"><label>À</label><input type="email" id="c-to"></div>
      <div class="field"><label>Objet</label><input type="text" id="c-subject"></div>
      <div class="field"><label>Message</label><textarea id="c-body"></textarea></div>
      <button class="btn btn-primary" id="send-btn" style="width:100%;">Envoyer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ⚠️ REMPLACE PAR TON URL RENDER
  const API = 'https://mail-backend-aoh4.onrender.com';
  const TOKEN_KEY = 'mail_token';
  
  const $ = id => document.getElementById(id);
  const getToken = () => localStorage.getItem(TOKEN_KEY);
  const setToken = t => localStorage.setItem(TOKEN_KEY, t);
  const clearToken = () => localStorage.removeItem(TOKEN_KEY);

  function toast(msg, type = 'success') {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 2500);
  }

  async function apiFetch(path, options = {}) {
    const headers = { ...(options.headers || {}) };
    const token = getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    const res = await fetch(API + path, { ...options, headers });
    if (res.status === 401) { clearToken(); showLogin(); throw new Error('Session expirée'); }
    return res;
  }

  function showLogin() { $('login-screen').classList.remove('hidden'); $('app').classList.remove('visible'); }
  function showApp() { $('login-screen').classList.add('hidden'); $('app').classList.add('visible'); loadMails(); }

  async function doLogin() {
    const pwd = $('login-password').value; if (!pwd) return;
    try {
      const res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
      const data = await res.json();
      if (data.ok && data.token) { setToken(data.token); showApp(); } else $('login-error').textContent = data.error;
    } catch (e) { $('login-error').textContent = 'Erreur réseau'; }
  }

  async function loadMails() {
    const list = $('mail-list'); list.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement…</div>';
    try {
      const res = await apiFetch('/api/mails');
      const mails = await res.json();
      if (!mails.length) { list.innerHTML = '<div class="empty">📭 Aucun mail</div>'; return; }
      list.innerHTML = mails.map((m, i) => `
        <div class="mail-item" data-idx="${i}">
          <div class="mail-header"><div class="mail-from">${m.from}</div></div>
          <div class="mail-subject">${m.subject}</div>
          <div class="mail-preview">${m.preview}</div>
        </div>`).join('');
      window._mails = mails;
      list.querySelectorAll('.mail-item').forEach(el => el.addEventListener('click', () => openMail(parseInt(el.dataset.idx))));
    } catch (e) { list.innerHTML = '<div class="empty">❌ Erreur</div>'; }
  }

  function openMail(idx) {
    const m = window._mails[idx]; if (!m) return;
    $('d-subject').textContent = m.subject; $('d-from').textContent = m.from; $('d-date').textContent = m.date; $('d-body').textContent = m.body;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); $('view-detail').classList.add('active');
  }

  async function sendMail() {
    const to = $('c-to').value, subject = $('c-subject').value, body = $('c-body').value;
    if (!to || !body) return toast('Champs requis', 'error');
    try {
      const res = await apiFetch('/api/send', { method: 'POST', body: JSON.stringify({ account_id: 3, to, subject, body }) });
      const data = await res.json();
      if (data.ok) { toast('Envoyé !'); $('c-to').value = ''; $('c-subject').value = ''; $('c-body').value = ''; }
      else toast(data.error, 'error');
    } catch (e) { toast('Erreur réseau', 'error'); }
  }

  $('login-btn').addEventListener('click', doLogin);
  $('logout-btn').addEventListener('click', () => { clearToken(); showLogin(); });
  $('refresh-btn').addEventListener('click', loadMails);
  $('back-btn').addEventListener('click', () => { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); $('view-inbox').classList.add('active'); });
  $('send-btn').addEventListener('click', sendMail);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); $('view-' + t.dataset.tab).classList.add('active');
  }));

  if (getToken()) showApp();
</script>
</body>
</html>
